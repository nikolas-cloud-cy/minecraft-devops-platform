
services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft-devops

    ports:
      - "127.0.0.1:25565:25565"

    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "26.3"
      MEMORY: "2G"
      MAX_PLAYERS: "10"
      MOTD: "Nikolas DevOps Lab"
      ONLINE_MODE: "TRUE"

    volumes:
      - minecraft-data:/data

    restart: unless-stopped

volumes:
  minecraft-data:
